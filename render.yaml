# Render Blueprint — provisions everything in one click:
#   • a web service (the FastAPI app + signup/dashboard)
#   • a daily cron job (generates + delivers each morning)
#   • a managed Postgres database (shared by both)
#
# Deploy: push this repo to GitHub, then Render → New → Blueprint → pick the repo.
# After it creates the services, set the secret env vars (marked sync:false) in
# the Render dashboard: API keys + the Google OAuth JSONs.

databases:
  - name: prospectdaily-db
    plan: basic-256mb        # ~$7/mo starter Postgres; upsize anytime

services:
  # --- Web app --------------------------------------------------------
  - type: web
    name: prospectdaily-web
    runtime: python
    plan: starter            # ~$7/mo
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: prospectdaily-db, property: connectionString }
      - key: APP_SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        sync: false          # e.g. https://prospectdaily.com
      - key: DATA_PROVIDER
        value: apollo
      - key: REPORT_FORMAT
        value: doc
      - { key: APOLLO_API_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: ANTHROPIC_MODEL, value: claude-sonnet-5 }
      - { key: GOOGLE_OAUTH_CLIENT_JSON, sync: false }
      - { key: GOOGLE_OAUTH_TOKEN_JSON, sync: false }
      - { key: STRIPE_SECRET_KEY, sync: false }
      - { key: STRIPE_WEBHOOK_SECRET, sync: false }
      - { key: STRIPE_PRICE_STARTER, sync: false }
      - { key: STRIPE_PRICE_GROWTH, sync: false }
      - { key: STRIPE_PRICE_PRO, sync: false }

  # --- Daily report job ----------------------------------------------
  - type: cron
    name: prospectdaily-cron
    runtime: python
    plan: starter
    schedule: "0 12 * * 1-5"  # 12:00 UTC, Mon–Fri only (~7am ET). Weekdays.
    buildCommand: pip install -r requirements.txt
    startCommand: python -m engine.daily
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: prospectdaily-db, property: connectionString }
      - key: DATA_PROVIDER
        value: apollo
      - key: REPORT_FORMAT
        value: doc
      - { key: APOLLO_API_KEY, sync: false }
      - { key: ANTHROPIC_API_KEY, sync: false }
      - { key: ANTHROPIC_MODEL, value: claude-sonnet-5 }
      - { key: GOOGLE_OAUTH_CLIENT_JSON, sync: false }
      - { key: GOOGLE_OAUTH_TOKEN_JSON, sync: false }
