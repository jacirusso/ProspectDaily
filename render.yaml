# Render Blueprint — provisions everything in one click:
#   • a web service (the FastAPI app + signup/dashboard)
#   • a daily cron job (generates + delivers each weekday morning)
#   • a managed Postgres database (shared by both)
#
# Deploy: push this repo to GitHub, then Render -> New -> Blueprint -> pick repo.
# After it creates the services, set the secret env vars (sync:false) in the
# Render dashboard: API keys + the Google OAuth JSONs.

databases:
  - name: prospectdaily-db
    plan: basic-256mb

services:
  # --- Web app --------------------------------------------------------
  - type: web
    name: prospectdaily-web
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn web.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: prospectdaily-db
          property: connectionString
      - key: APP_SECRET_KEY
        generateValue: true
      - key: APP_BASE_URL
        sync: false
      - key: DATA_PROVIDER
        value: apollo
      - key: REPORT_FORMAT
        value: pdf
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: APOLLO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_OAUTH_TOKEN_JSON
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: PDF_SERVICE_URL          # set to the prospectdaily-pdf service URL
        sync: false
      - fromGroup: pdf-shared

  # --- Daily report job (weekdays) -----------------------------------
  - type: cron
    name: prospectdaily-cron
    runtime: python
    plan: starter
    schedule: "0 12 * * 1-5"
    buildCommand: pip install -r requirements.txt
    startCommand: python -m engine.daily
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: DATABASE_URL
        fromDatabase:
          name: prospectdaily-db
          property: connectionString
      - key: DATA_PROVIDER
        value: apollo
      - key: REPORT_FORMAT
        value: pdf
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: APOLLO_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_JSON
        sync: false
      - key: GOOGLE_OAUTH_TOKEN_JSON
        sync: false
      - key: PDF_SERVICE_URL          # set to the prospectdaily-pdf service URL
        sync: false
      - fromGroup: pdf-shared

  # --- PDF render service (WeasyPrint in a container) -----------------
  - type: web
    name: prospectdaily-pdf
    runtime: docker
    plan: starter
    dockerfilePath: ./pdfservice/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - fromGroup: pdf-shared

# Shared generated secret so web/cron and the PDF service agree on the header.
envVarGroups:
  - name: pdf-shared
    envVars:
      - key: PDF_SERVICE_SECRET
        generateValue: true
