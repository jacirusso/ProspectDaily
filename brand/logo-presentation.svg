<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <linearGradient id="ind" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <!-- Reusable icon: a "target / located prospect" bullseye -->
    <g id="mark">
      <rect x="0" y="0" width="120" height="120" rx="30" fill="url(#ind)"/>
      <circle cx="60" cy="60" r="37" fill="none" stroke="#ffffff" stroke-width="7"/>
      <circle cx="60" cy="60" r="22" fill="none" stroke="#ffffff" stroke-width="7" opacity="0.7"/>
      <circle cx="60" cy="60" r="10" fill="#ffffff"/>
    </g>
  </defs>

  <!-- Light panel: primary horizontal logo -->
  <rect x="0" y="0" width="900" height="300" fill="#ffffff"/>
  <use href="#mark" x="70" y="105" width="90" height="90"/>
  <text x="212" y="167" font-size="52" font-weight="700" fill="#14161f">Prospect<tspan fill="#059669">Daily</tspan></text>
  <text x="214" y="200" font-size="18" font-weight="500" fill="#6b7280" letter-spacing="3">FRESH B2B PROSPECTS, DAILY</text>

  <!-- icon sizes -->
  <use href="#mark" x="640" y="95" width="110" height="110"/>
  <use href="#mark" x="770" y="130" width="56" height="56"/>
  <use href="#mark" x="836" y="152" width="34" height="34"/>

  <!-- Dark panel: reversed logo -->
  <rect x="0" y="300" width="900" height="260" fill="#10121a"/>
  <use href="#mark" x="70" y="360" width="90" height="90"/>
  <text x="212" y="422" font-size="52" font-weight="700" fill="#ffffff">Prospect<tspan fill="#6ee7b7">Daily</tspan></text>
  <text x="214" y="455" font-size="18" font-weight="500" fill="#9aa1ad" letter-spacing="3">FRESH B2B PROSPECTS, DAILY</text>
</svg>
