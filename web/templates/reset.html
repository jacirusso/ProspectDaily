{% extends "base.html" %}
{% block wrapclass %}narrow{% endblock %}
{% block body %}
<div class="card">
  <h1>Set a new password</h1>
  {% if not valid %}
    <div class="error">This reset link is invalid or has expired.</div>
    <p><a href="/forgot">Request a new link</a></p>
  {% else %}
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <form method="post" action="/reset">
      <input type="hidden" name="token" value="{{ token }}">
      <label>New password <span class="help">At least 8 characters.</span>
        <input type="password" name="password" required autofocus></label>
      <p style="margin-top:16px"><button class="btn" type="submit">Set password</button></p>
    </form>
  {% endif %}
</div>
{% endblock %}
