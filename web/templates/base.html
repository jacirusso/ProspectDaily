<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ProspectDaily — Fresh B2B prospects, every weekday{% endblock %}</title>
  <meta name="description" content="{% block description %}ProspectDaily delivers verified B2B prospects to your Google Drive every weekday — company, contact, email, phone, LinkedIn, and a researched, ready-to-send intro email. Set your target audience once and wake up to fresh prospects.{% endblock %}">
  <meta name="robots" content="index, follow">
  <link rel="canonical" href="https://prospectdaily.com{% block canonical %}/{% endblock %}">
  <!-- Open Graph / social share -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="ProspectDaily">
  <meta property="og:title" content="ProspectDaily — Fresh B2B prospects, every weekday">
  <meta property="og:description" content="Verified B2B prospects delivered every weekday, each with a ready-to-send intro email.">
  <meta property="og:url" content="https://prospectdaily.com/">
  <meta property="og:image" content="https://prospectdaily.com/static/logo-full.svg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="ProspectDaily — Fresh B2B prospects, every weekday">
  <meta name="twitter:description" content="Verified B2B prospects delivered every weekday, each with a ready-to-send intro email.">
  <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <nav class="nav">
    <a class="brand" href="/"><img class="brand-icon" src="/static/icon.svg" alt="">Prospect<span class="brand-daily">Daily</span></a>
    <span class="spacer"></span>
    {% if user %}
      <a href="/dashboard">Dashboard</a>
      <a href="/questionnaire">Target Audience</a>
      <a href="/crm">LeadDaily</a>
      <a href="/plans">Plan</a>
      {% if is_operator %}<a href="/admin">Admin</a>{% endif %}
      <a href="/logout">Log out</a>
    {% else %}
      <a href="/login">Log in</a>
      <a class="btn small" href="/signup">Get started</a>
    {% endif %}
  </nav>
  {% block outer %}
  <div class="wrap {% block wrapclass %}{% endblock %}">
    {% block body %}{% endblock %}
  </div>
  {% endblock %}
</body>
</html>
