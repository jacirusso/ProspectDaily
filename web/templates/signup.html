{% extends "base.html" %}
{% block wrapclass %}narrow{% endblock %}
{% block body %}
<div class="card">
  <h1>Create your account</h1>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post" action="/signup">
    <label>Work email<input type="email" name="email" required autofocus></label>
    <label>Password <span class="help">At least 8 characters.</span>
      <input type="password" name="password" required></label>
    <p style="margin-top:18px"><button class="btn" type="submit">Create account</button></p>
  </form>
  <p class="muted">Already have an account? <a href="/login">Log in</a>.</p>
</div>
{% endblock %}
